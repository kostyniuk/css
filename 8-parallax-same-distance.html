<main>
  <section class="stage">
    <div class="track">
      <div class="dot fast">Fast</div>
      <div class="dot slow">Slow</div>
    </div>
  </section>
  <section class="content">
    <p>Both dots travel 5vh. The fast one finishes earlier.</p>
  </section>
</main>

<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #171717;
    color: white;
  }

  .stage {
    min-height: 180vh;
    padding-top: 15vh;
    background: linear-gradient(#202020, #455c3f);
  }

  .track {
    position: fixed;
    top: 15vh;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 2rem;
  }

  .dot {
    display: grid;
    width: 6rem;
    aspect-ratio: 1;
    place-items: center;
    border-radius: 50%;
    font-weight: 700;

    /* Scroll drives progress; the keyframes below decide the travel distance. */
    animation-name: move-down;
    animation-duration: auto;
    animation-timing-function: linear;
    animation-timeline: scroll(root);
    animation-fill-mode: both;
  }

  .fast {
    background: #ff6b6b;

    /* Same distance as .slow, but completed during the first 25% of scroll. */
    animation-range: 0% 25%;
  }

  .slow {
    background: #4dabf7;

    /* Same distance as .fast, but spread across the first 75% of scroll. */
    animation-range: 0% 75%;
  }

  @keyframes move-down {
    to {
      /* Fixed distance: both dots move exactly 40px. */
      translate: 0 40px;
    }
  }

  .content {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    font-size: 2rem;
  }
</style>
